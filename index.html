<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>羽村市議会シンプル検索</title>
    <link rel="stylesheet" href="static/style.css" />
    <style>
      .inline-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 10px;
        background: #eef4ff;
        color: #1f3b73;
        border-radius: 999px;
        border: 1px solid #d4e0ff;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="container">
        <div>
          <p class="eyebrow">Council minutes search</p>
          <h1>羽村市議会 横断検索（スタンドアロン版）</h1>
          <p class="lead">
            ダウンロード後に <strong>index.html を開くだけ</strong> で動作する、議事録検索のミニマル版です。
            キーワード検索・開催種別・テーマ・年度・発言者で素早く絞り込めます。
          </p>
        </div>
        <span class="pill">オフライン対応</span>
      </div>
    </header>

    <main class="container">
      <section class="search-card">
        <form id="search-form">
          <div class="field-group">
            <label for="q">キーワード</label>
            <input
              id="q"
              name="q"
              type="search"
              placeholder="例）防災 避難所 or 給食センター"
              autocomplete="off"
            />
            <p class="hint">タイトル・概要・本文から部分一致で検索します（スペース区切り対応）。</p>
          </div>

          <div class="grid">
            <div class="field-group">
              <label for="committee">開催種別</label>
              <select id="committee" name="committee">
                <option value="">すべて</option>
              </select>
            </div>

            <div class="field-group">
              <label for="category">テーマ</label>
              <select id="category" name="category">
                <option value="">すべて</option>
              </select>
            </div>

            <div class="field-group">
              <label for="year">年度</label>
              <select id="year" name="year">
                <option value="">すべて</option>
              </select>
            </div>

            <div class="field-group">
              <label for="speaker">発言者</label>
              <select id="speaker" name="speaker">
                <option value="">すべて</option>
              </select>
            </div>
          </div>

          <div class="actions">
            <button class="primary" type="submit">この条件で検索</button>
            <button class="ghost" type="button" id="reset-btn">条件をクリア</button>
          </div>
        </form>
      </section>

      <section class="results" aria-live="polite">
          <div class="results-meta">
            <p id="result-count">6件ヒット</p>
            <p class="date" id="active-filter"></p>
          </div>
          <ul class="result-list" id="result-list"></ul>
          <div class="empty" id="empty-state" hidden>条件に合う議事録がありませんでした。</div>
        </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p class="summary">
          サンプルデータは「防災・教育・まちづくり・交通・環境」の6件を収録しています。フィルターを組み合わせて動きをご確認ください。
        </p>
      </div>
    </footer>

    <script src="data/meetings.js"></script>
    <script>
      const records = (window.MEETING_DATA || []).map((item) => ({
        ...item,
        dateObj: new Date(item.date),
        year: new Date(item.date).getFullYear(),
      }));

      const form = document.getElementById("search-form");
      const resultList = document.getElementById("result-list");
      const resultCount = document.getElementById("result-count");
      const emptyState = document.getElementById("empty-state");
      const activeFilter = document.getElementById("active-filter");

      const controls = {
        q: document.getElementById("q"),
        committee: document.getElementById("committee"),
        category: document.getElementById("category"),
        year: document.getElementById("year"),
        speaker: document.getElementById("speaker"),
      };

      function uniq(values) {
        return [...new Set(values)].filter(Boolean);
      }

      function escapeHTML(value) {
        return (value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      function populateSelect(selectEl, values) {
        values.forEach((value) => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = value;
          selectEl.appendChild(option);
        });
      }

      function bootstrapFilters() {
        const committees = uniq(records.map((r) => r.committee)).sort();
        const categories = uniq(records.map((r) => r.category)).sort();
        const speakers = uniq(records.flatMap((r) => r.speakers)).sort();
        const years = uniq(records.map((r) => r.year)).sort((a, b) => b - a);

        populateSelect(controls.committee, committees);
        populateSelect(controls.category, categories);
        populateSelect(controls.speaker, speakers);
        populateSelect(controls.year, years);
      }

      function highlightSnippet(text, keywords, length = 160) {
        if (!keywords.length) return escapeHTML(text.slice(0, length));
        const focus = keywords[0];
        const pattern = new RegExp(focus.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
        const match = pattern.exec(text);
        if (!match) return escapeHTML(text.slice(0, length));

        const start = Math.max(match.index - 40, 0);
        const end = Math.min(match.index + focus.length + 80, text.length);
        const snippet = text.slice(start, end);
        const before = escapeHTML(snippet.slice(0, match.index - start));
        const found = escapeHTML(snippet.slice(match.index - start, match.index - start + match[0].length));
        const after = escapeHTML(snippet.slice(match.index - start + match[0].length));
        return `${before}<mark>${found}</mark>${after}`;
      }

      function scoreRecord(record, keywords) {
        if (!keywords.length) return 1;
        const haystack = `${record.title} ${record.summary} ${record.body}`.toLowerCase();
        return keywords.reduce((score, word) => {
          const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const regex = new RegExp(escaped, "g");
          const matches = haystack.match(regex);
          return score + (matches ? matches.length : 0);
        }, 0);
      }

      function formatDate(value) {
        const d = new Date(value);
        return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
      }

      function render(results, keywords) {
        resultList.innerHTML = "";
        emptyState.hidden = results.length !== 0;
        resultCount.textContent = `${results.length}件ヒット`;

        results.forEach((record) => {
          const li = document.createElement("li");
          li.className = "result-item";

          const header = document.createElement("div");
          header.className = "result-header";
          const titleEl = document.createElement("h3");
          titleEl.textContent = record.title;
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = record.category;
          header.appendChild(titleEl);
          header.appendChild(badge);

          const meta = document.createElement("p");
          meta.className = "meta";
          meta.textContent = `${formatDate(record.date)}｜${record.committee}`;

          const summary = document.createElement("p");
          summary.className = "summary";
          summary.textContent = record.summary;

          const snippet = document.createElement("p");
          snippet.className = "snippet";
          const sourceText = record.body || record.summary || "";
          snippet.innerHTML = highlightSnippet(sourceText, keywords);

          const chips = document.createElement("div");
          chips.className = "actions";
          const badges = [
            `🗓️ ${record.year}年度`,
            record.location ? `📍 ${record.location}` : null,
          ]
            .filter(Boolean)
            .map((text) => {
              const badgeEl = document.createElement("span");
              badgeEl.className = "inline-badge";
              badgeEl.textContent = text;
              return badgeEl;
            });

          const speakerBadges = record.speakers.map((name) => {
            const badgeEl = document.createElement("span");
            badgeEl.className = "inline-badge";
            badgeEl.textContent = `👤 ${name}`;
            return badgeEl;
          });

          [...badges, ...speakerBadges].forEach((badgeEl) => chips.appendChild(badgeEl));

          li.appendChild(header);
          li.appendChild(meta);
          li.appendChild(summary);
          li.appendChild(snippet);
          li.appendChild(chips);
          resultList.appendChild(li);
        });
      }

      function applySearch(params) {
        const keywords = (params.q || "")
          .split(/\s+/)
          .map((s) => s.trim())
          .filter(Boolean)
          .map((s) => s.toLowerCase());

        const filtered = records
          .map((record) => ({ ...record, score: scoreRecord(record, keywords) }))
          .filter((record) => {
            if (params.committee && record.committee !== params.committee) return false;
            if (params.category && record.category !== params.category) return false;
            if (params.year && record.year.toString() !== params.year) return false;
            if (params.speaker && !record.speakers.includes(params.speaker)) return false;
            if (keywords.length && record.score === 0) return false;
            return true;
          })
          .sort((a, b) => b.score - a.score || b.dateObj - a.dateObj);

        render(filtered, keywords);
        renderActiveFilter(params);
      }

      function renderActiveFilter(params) {
        const tags = [];
        if (params.committee) tags.push(`開催種別: ${params.committee}`);
        if (params.category) tags.push(`テーマ: ${params.category}`);
        if (params.year) tags.push(`年度: ${params.year}`);
        if (params.speaker) tags.push(`発言者: ${params.speaker}`);
        if (params.q) tags.push(`キーワード: ${params.q}`);

        activeFilter.textContent = tags.length ? tags.join(" / ") : "絞り込み未指定";
      }

      function readFormParams() {
        return {
          q: controls.q.value.trim(),
          committee: controls.committee.value,
          category: controls.category.value,
          year: controls.year.value,
          speaker: controls.speaker.value,
        };
      }

      function resetForm() {
        form.reset();
        applySearch(readFormParams());
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        applySearch(readFormParams());
      });

      document.getElementById("reset-btn").addEventListener("click", resetForm);

      bootstrapFilters();
      applySearch(readFormParams());
    </script>
  </body>
</html>
